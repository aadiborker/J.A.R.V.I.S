<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws://127.0.0.1:* ws://localhost:*"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.A.R.V.I.S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="sfx.js"></script>
  </head>
  <body>
    <div class="hud">
      <div class="scanlines" aria-hidden="true"></div>
      <div class="grid" aria-hidden="true"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>

      <header class="titlebar">
        <div class="brand-block">
          <div class="brand">J.A.R.V.I.S</div>
          <div class="state-badge" id="stateBadge">STANDBY</div>
        </div>
        <div class="timer-chip hidden" id="timerChip" title="Active timer">
          <span class="timer-label" id="timerLabel">TIMER</span>
          <span class="timer-count" id="timerCount">--:--</span>
        </div>
        <div class="conn" id="connPill">Booting</div>
        <div class="wan" id="wanPill" title="Internet">WAN —</div>
        <div class="power" id="powerPill" title="Power">PWR —</div>
        <div class="win-controls">
          <button type="button" id="btnMin" aria-label="Minimize">—</button>
          <button type="button" id="btnClose" aria-label="Quit">×</button>
        </div>
      </header>

      <main class="stage">
        <section class="hero">
          <div class="holo-stage" id="ringWrap" data-state="idle">
            <div class="holo-frame">
              <canvas id="waveCanvas" width="420" height="460" aria-hidden="true"></canvas>
              <div class="holo-beam"></div>
              <div class="holo-scan"></div>
            </div>
            <div class="holo-caption" id="holoCaption">STANDBY</div>
          </div>
          <p class="status" id="statusLine">Starting… say “hey jarvis” after Connected.</p>
        </section>

        <section class="transcript-panel">
          <div class="panel-label">COMMS</div>
          <div class="transcript" id="transcript" aria-live="polite"></div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
